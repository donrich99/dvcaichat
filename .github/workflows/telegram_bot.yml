name: Telegram Bot Poller

on:
  schedule:
    - cron: '*/2 * * * *'  # Every 2 minutes
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write

jobs:
  poll-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bot/bot_worker.py

      - name: Commit state update
        run: |
          git config user.name "DVC AI Bot"
          git config user.email "bot@dvcaichat"
          git add bot/bot_state.json
          git diff --staged --quiet || git commit -m "bot: update state" && git push
